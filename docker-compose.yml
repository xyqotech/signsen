# SignSen and its PostgreSQL database, behind your reverse proxy (Caddy, Nginx,
# Traefik…) which terminates TLS and sets X-Forwarded-For.
# Copy .env.example to .env and edit it first. POSTGRES_PASSWORD has no default:
# while it is empty the database refuses to initialise and SignSen is not started.
services:
  signsen:
    build: .
    image: signsen:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # The bundled database below. To use a PostgreSQL server of your own,
      # replace this line (and drop the db service).
      DATABASE_URL: postgres://signsen:${POSTGRES_PASSWORD}@db:5432/signsen
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SIGNSEN_HOST_PORT:-3000}:3000"
    volumes:
      - signsen-data:/data

  db:
    # Pinned on purpose. A new major version needs a dump and restore
    # (see "Where the state lives, and how to back it up" in the README), never a silent image bump.
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: signsen
      POSTGRES_DB: signsen
      # From .env, on purpose without a fallback value: an empty password is
      # refused by the postgres image, never replaced by a weak default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signsen -d signsen"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>.
      - signsen-db:/var/lib/postgresql

volumes:
  signsen-data:
  signsen-db:
